name: BXBan
version: 1.0.0
main: com.furkgame.bxban.BXBan
author: Furkan Game
description: Türkçe, hafif ve özelleştirilebilir ceza yönetim eklentisi.
website: https://modrinth.com/
commands:
  ban:
    description: Oyuncuyu kalıcı olarak yasaklar.
    usage: /ban <oyuncu> <sebep>
    aliases: [yasakla]
  tempban:
    description: Oyuncuyu süreli olarak yasaklar.
    usage: /tempban <oyuncu> <süre> <sebep>
    aliases: [geciciyasakla]
  unban:
    description: Oyuncunun yasağını kaldırır.
    usage: /unban <oyuncu>
    aliases: [yasakkaldir]
  banip:
    description: Oyuncunun IP adresini yasaklar.
    usage: /banip <oyuncu> <sebep>
    aliases: [ipyasakla]
  unbanip:
    description: IP yasağını kaldırır.
    usage: /unbanip <ip>
    aliases: [ipyasakkaldir]
  kick:
    description: Oyuncuyu sunucudan atar.
    usage: /kick <oyuncu> <sebep>
    aliases: [at]
  mute:
    description: Oyuncuyu susturur.
    usage: /mute <oyuncu> <süre|kalıcı> <sebep>
    aliases: [sustur]
  unmute:
    description: Oyuncunun susturmasını kaldırır.
    usage: /unmute <oyuncu>
    aliases: [susturmayikaldir]
  warn:
    description: Oyuncuya uyarı verir.
    usage: /warn <oyuncu> <sebep>
    aliases: [uyar]
  history:
    description: Oyuncunun ceza geçmişini gösterir.
    usage: /history <oyuncu>
    aliases: [gecmis]
  banlist:
    description: Aktif yasakları listeler.
    usage: /banlist
    aliases: [yasaklilar]
  bxban:
    description: BXBan yönetim komutları.
    usage: /bxban reload
    aliases: [bx]
permissions:
  bxban.ban: {default: op}
  bxban.tempban: {default: op}
  bxban.unban: {default: op}
  bxban.banip: {default: op}
  bxban.unbanip: {default: op}
  bxban.kick: {default: op}
  bxban.mute: {default: op}
  bxban.unmute: {default: op}
  bxban.warn: {default: op}
  bxban.history: {default: op}
  bxban.banlist: {default: op}
  bxban.reload: {default: op}
